<script>
(function(){
  document.body.classList.remove('no-js');
  var tabs=[].slice.call(document.querySelectorAll('[role="tab"]'));
  function select(t){tabs.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});}
  tabs.forEach(function(t,i){
    t.addEventListener('click',function(){select(t);history.replaceState(null,'','#'+t.id.slice(4));});
    t.addEventListener('keydown',function(e){var d=e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0;if(d){var n=tabs[(i+d+tabs.length)%tabs.length];select(n);n.focus();e.preventDefault();}});
  });
  select(document.getElementById('tab-'+location.hash.slice(1))||tabs[0]);
})();
</script>
