<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Learning to learn: later problems are solved faster</title>
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#f7f7f4"/>

  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="90" y1="320" x2="540" y2="320" marker-end="url(#a6)"/>
    <line x1="90" y1="320" x2="90" y2="40" marker-end="url(#a6)"/>
  </g>
  <g stroke="#ccc" stroke-dasharray="3 4">
    <line x1="90" y1="200" x2="530" y2="200"/>
    <line x1="90" y1="80" x2="530" y2="80"/>
  </g>
  <g font-size="12" fill="#666" text-anchor="end">
    <text x="82" y="204">chance</text>
    <text x="82" y="84">perfect</text>
  </g>
  <g font-size="12" fill="#666" text-anchor="middle">
    <text x="130" y="340">1</text><text x="210" y="340">2</text><text x="290" y="340">3</text>
    <text x="370" y="340">4</text><text x="450" y="340">5</text><text x="510" y="340">6</text>
  </g>
  <text x="310" y="368" text-anchor="middle" font-size="13" fill="#555">attempt number within one new problem →</text>
  <text x="34" y="190" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90 34 190)">% correct →</text>

  <!-- early problems: slow rise -->
  <polyline fill="none" stroke="#999" stroke-width="2.8" points="130,200 210,180 290,160 370,144 450,128 510,118"/>
  <g fill="#999"><circle cx="130" cy="200" r="4"/><circle cx="210" cy="180" r="4"/><circle cx="290" cy="160" r="4"/><circle cx="370" cy="144" r="4"/><circle cx="450" cy="128" r="4"/><circle cx="510" cy="118" r="4"/></g>
  <!-- later problems: jump after attempt 1 -->
  <polyline fill="none" stroke="#7a5cc2" stroke-width="3" points="130,200 210,92 290,88 370,86 450,84 510,84"/>
  <g fill="#7a5cc2"><circle cx="130" cy="200" r="4.5"/><circle cx="210" cy="92" r="4.5"/><circle cx="290" cy="88" r="4.5"/><circle cx="370" cy="86" r="4.5"/><circle cx="450" cy="84" r="4.5"/><circle cx="510" cy="84" r="4.5"/></g>

  <g font-size="13.5">
    <text x="566" y="112" font-weight="700" fill="#7a5cc2">After many problems</text>
    <text x="566" y="130" font-size="12" fill="#5d4597">one try is enough to</text>
    <text x="566" y="146" font-size="12" fill="#5d4597">work out the answer</text>
    <text x="566" y="196" font-weight="600" fill="#777">First problems</text>
    <text x="566" y="214" font-size="12" fill="#777">slow trial and error</text>
  </g>

  <text x="24" y="388" font-size="12" fill="#777">Schematic of the "learning set" pattern. Attempt 1 is always a guess: nothing tells the learner which object is right yet.</text>
</svg>
