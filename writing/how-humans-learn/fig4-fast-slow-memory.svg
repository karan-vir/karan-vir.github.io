<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Two memory systems: fast hippocampus, slow neocortex</title>
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="a4g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a9a5b"/>
    </marker>
    <marker id="a4p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a5cc2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="430" rx="14" fill="#f7f7f4"/>

  <!-- experience -->
  <rect x="300" y="24" width="180" height="44" rx="10" fill="#fdf1e4" stroke="#d9822b" stroke-width="2"/>
  <text x="390" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#1d1d1b">New experience</text>

  <!-- hippocampus -->
  <rect x="40" y="130" width="280" height="160" rx="12" fill="#fff" stroke="#3a9a5b" stroke-width="2.5"/>
  <text x="180" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1b">Hippocampus</text>
  <text x="180" y="180" text-anchor="middle" font-size="13" fill="#3a9a5b" font-weight="600">FAST</text>
  <g font-size="12.5" fill="#444">
    <text x="64" y="208">• learns from one exposure</text>
    <text x="64" y="228">• keeps episodes separate</text>
    <text x="64" y="248">• "what happened today"</text>
  </g>
  <!-- separate dots -->
  <g fill="#3a9a5b"><circle cx="250" cy="270" r="5"/><circle cx="272" cy="262" r="5"/><circle cx="294" cy="274" r="5"/></g>

  <!-- neocortex -->
  <rect x="460" y="130" width="280" height="160" rx="12" fill="#fff" stroke="#7a5cc2" stroke-width="2.5"/>
  <text x="600" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#1d1d1b">Neocortex</text>
  <text x="600" y="180" text-anchor="middle" font-size="13" fill="#7a5cc2" font-weight="600">SLOW</text>
  <g font-size="12.5" fill="#444">
    <text x="484" y="208">• learns over many exposures</text>
    <text x="484" y="228">• overlapping, shared knowledge</text>
    <text x="484" y="248">• "how things usually work"</text>
  </g>
  <!-- overlapping web -->
  <g stroke="#7a5cc2" stroke-width="1.5" fill="#efe9fa">
    <line x1="664" y1="264" x2="690" y2="276"/><line x1="690" y1="276" x2="714" y2="262"/><line x1="664" y1="264" x2="714" y2="262"/>
    <circle cx="664" cy="264" r="5"/><circle cx="690" cy="276" r="5"/><circle cx="714" cy="262" r="5"/>
  </g>

  <!-- arrows -->
  <path d="M340,70 Q260,90 220,126" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a4)"/>
  <text x="246" y="102" font-size="12" fill="#555" text-anchor="end">captured at once</text>

  <path d="M324,232 Q390,190 456,232" fill="none" stroke="#3a9a5b" stroke-width="3" marker-end="url(#a4g)"/>
  <text x="390" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2d7a48">replay</text>
  <text x="390" y="188" text-anchor="middle" font-size="11.5" fill="#2d7a48">(e.g. during sleep)</text>

  <path d="M440,70 Q540,90 580,126" fill="none" stroke="#7a5cc2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a4p)"/>
  <text x="604" y="84" font-size="12" fill="#5d4597">shortcut: fast if it</text>
  <text x="604" y="100" font-size="12" fill="#5d4597">fits what you know</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="700" height="72" rx="10" fill="#fff" stroke="#ddd"/>
  <text x="60" y="344" font-size="13" font-weight="600" fill="#1d1d1b">Why two systems?</text>
  <text x="60" y="366" font-size="12.5" fill="#444">If the slow store learned everything fast, each new thing would overwrite old knowledge.</text>
  <text x="60" y="384" font-size="12.5" fill="#444">The fast store holds it; replay feeds it in slowly, mixed with what is already known.</text>

  <text x="24" y="416" font-size="12" fill="#777">Schematic. Boxes describe the roles the theory assigns, not anatomy.</text>
</svg>
