<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 598" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Modules, signals and timescales</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a9a5b"/></marker>
  </defs>
  <rect x="0" y="0" width="820" height="598" rx="14" fill="#f7f7f4"/>

  <!-- world -->
  <rect x="40" y="22" width="240" height="50" rx="10" fill="#fdf1e4" stroke="#d9822b" stroke-width="2"/>
  <text x="160" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1b">The world</text>
  <text x="160" y="62" text-anchor="middle" font-size="11" fill="#8a5a22">the correction the learner can't fake</text>
  <path d="M120,74 L120,148" stroke="#d9822b" stroke-width="2" fill="none" marker-end="url(#fo)"/>
  <path d="M200,148 L200,76" stroke="#d9822b" stroke-width="2" fill="none" marker-end="url(#fo)"/>
  <text x="112" y="116" text-anchor="end" font-size="11.5" fill="#8a5a22">outcome</text>
  <text x="208" y="116" font-size="11.5" fill="#8a5a22">act</text>

  <text x="410" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#777" letter-spacing="1">MODULES: where knowledge lives</text>

  <!-- modules -->
  <rect x="40" y="150" width="240" height="96" rx="12" fill="#fff" stroke="#7a5cc2" stroke-width="2.5"/>
  <text x="160" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1b">Fast learner</text>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#5d4597">prefrontal activity (§7)</text>
  <text x="160" y="222" text-anchor="middle" font-size="12" fill="#444">predicts, chooses, adapts</text>
  <text x="160" y="238" text-anchor="middle" font-size="12" fill="#444">within a task</text>

  <rect x="310" y="150" width="210" height="96" rx="12" fill="#fff" stroke="#3a9a5b" stroke-width="2.5"/>
  <text x="415" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1b">Fast store</text>
  <text x="415" y="198" text-anchor="middle" font-size="12" fill="#2d7a48">hippocampus (§5)</text>
  <text x="415" y="222" text-anchor="middle" font-size="12" fill="#444">today's episodes,</text>
  <text x="415" y="238" text-anchor="middle" font-size="12" fill="#444">kept separate</text>

  <rect x="550" y="150" width="230" height="96" rx="12" fill="#fff" stroke="#2f6fdf" stroke-width="2.5"/>
  <text x="665" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1d1d1b">Slow store</text>
  <text x="665" y="198" text-anchor="middle" font-size="12" fill="#2f6fdf">neocortex (§5)</text>
  <text x="665" y="222" text-anchor="middle" font-size="12" fill="#444">general knowledge,</text>
  <text x="665" y="238" text-anchor="middle" font-size="12" fill="#444">built over a lifetime</text>

  <!-- module arrows -->
  <path d="M282,180 L308,180" stroke="#555" stroke-width="2" fill="none" marker-end="url(#f)"/>
  <path d="M522,180 L548,180" stroke="#3a9a5b" stroke-width="2.5" fill="none" marker-end="url(#fg)"/>
  <text x="535" y="126" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2d7a48">replay</text>
  <text x="535" y="141" text-anchor="middle" font-size="11" fill="#2d7a48">during rest</text>
  <path d="M665,248 Q665,276 420,276 Q200,276 180,250" stroke="#2f6fdf" stroke-width="1.8" stroke-dasharray="5 4" fill="none" marker-end="url(#f)"/>
  <text x="430" y="294" text-anchor="middle" font-size="11.5" fill="#2f5fb0">what you know shapes what you predict and how fast you learn</text>

  <!-- bus -->
  <line x1="40" y1="324" x2="780" y2="324" stroke="#999" stroke-width="3"/>
  <text x="410" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#777" letter-spacing="1">SIGNALS: decide which module updates, and by how much</text>

  <!-- signal chips -->
  <g font-size="12">
    <line x1="130" y1="324" x2="130" y2="340" stroke="#999" stroke-width="2"/>
    <rect x="40" y="340" width="180" height="88" rx="10" fill="#fff" stroke="#d9822b" stroke-width="2"/>
    <text x="130" y="362" text-anchor="middle" font-weight="700" font-size="13.5" fill="#1d1d1b">Surprise</text>
    <text x="130" y="381" text-anchor="middle" fill="#444">what to update</text>
    <text x="130" y="398" text-anchor="middle" fill="#888">prediction error</text>
    <text x="130" y="415" text-anchor="middle" fill="#888">§3</text>
    <line x1="315" y1="324" x2="315" y2="340" stroke="#999" stroke-width="2"/>
    <rect x="225" y="340" width="180" height="88" rx="10" fill="#fff" stroke="#d9822b" stroke-width="2"/>
    <text x="315" y="362" text-anchor="middle" font-weight="700" font-size="13.5" fill="#1d1d1b">Learning progress</text>
    <text x="315" y="381" text-anchor="middle" fill="#444">where to go next</text>
    <text x="315" y="398" text-anchor="middle" fill="#888">error falling over time</text>
    <text x="315" y="415" text-anchor="middle" fill="#888">§4</text>
    <line x1="500" y1="324" x2="500" y2="340" stroke="#999" stroke-width="2"/>
    <rect x="410" y="340" width="180" height="88" rx="10" fill="#fff" stroke="#d9822b" stroke-width="2"/>
    <text x="500" y="362" text-anchor="middle" font-weight="700" font-size="13.5" fill="#1d1d1b">Plasticity</text>
    <text x="500" y="381" text-anchor="middle" fill="#444">how much to change</text>
    <text x="500" y="398" text-anchor="middle" fill="#888">set by its history</text>
    <text x="500" y="415" text-anchor="middle" fill="#888">§6</text>
    <line x1="685" y1="324" x2="685" y2="340" stroke="#999" stroke-width="2"/>
    <rect x="595" y="340" width="180" height="88" rx="10" fill="#fff" stroke="#d9822b" stroke-width="2"/>
    <text x="685" y="362" text-anchor="middle" font-weight="700" font-size="13.5" fill="#1d1d1b">Rest</text>
    <text x="685" y="381" text-anchor="middle" fill="#444">when to consolidate</text>
    <text x="685" y="398" text-anchor="middle" fill="#888">replay into the slow store</text>
    <text x="685" y="415" text-anchor="middle" fill="#888">§5</text>
  </g>
  <path d="M190,432 Q232,452 275,432" stroke="#d9822b" stroke-width="1.8" fill="none" marker-end="url(#fo)"/>
  <text x="232" y="458" text-anchor="middle" font-size="11" fill="#8a5a22">tracked over time</text>

<!-- timescales -->
  <text x="410" y="490" text-anchor="middle" font-size="12" font-weight="600" fill="#777" letter-spacing="1">TIMESCALES: different modules update at different speeds</text>
  <line x1="60" y1="516" x2="770" y2="516" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <g font-size="12" text-anchor="middle">
    <circle cx="110" cy="516" r="5" fill="#d9822b"/><text x="110" y="538" font-weight="600" fill="#1d1d1b">moment</text><text x="110" y="554" fill="#666">surprise updates</text>
    <circle cx="300" cy="516" r="5" fill="#7a5cc2"/><text x="300" y="538" font-weight="600" fill="#1d1d1b">task</text><text x="300" y="554" fill="#666">fast learner adapts</text>
    <circle cx="490" cy="516" r="5" fill="#3a9a5b"/><text x="490" y="538" font-weight="600" fill="#1d1d1b">night</text><text x="490" y="554" fill="#666">replay consolidates</text>
    <circle cx="680" cy="516" r="5" fill="#2f6fdf"/><text x="680" y="538" font-weight="600" fill="#1d1d1b">lifetime</text><text x="680" y="554" fill="#666">learning to learn</text>
  </g>

  <text x="24" y="586" font-size="11.5" fill="#777">My synthesis of Sections 3–7, inspired by the idea that a few signals set the knobs of learning (Doya, 2002).</text>
</svg>
