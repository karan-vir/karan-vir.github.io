<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Learning progress: where curiosity points</title>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="400" rx="14" fill="#f7f7f4"/>

  <!-- axes -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="80" y1="330" x2="560" y2="330" marker-end="url(#a3)"/>
    <line x1="80" y1="330" x2="80" y2="40" marker-end="url(#a3)"/>
  </g>
  <text x="320" y="362" text-anchor="middle" font-size="13" fill="#555">practice on the task →</text>
  <text x="40" y="190" text-anchor="middle" font-size="13" fill="#555" transform="rotate(-90 40 190)">prediction error →</text>

  <!-- too hard: high, flat, noisy -->
  <polyline fill="none" stroke="#999" stroke-width="2.5" points="90,80 120,72 150,86 180,70 210,84 240,74 270,88 300,72 330,82 360,70 390,86 420,76 450,84 480,72 520,80"/>
  <!-- sweet spot: falling -->
  <path fill="none" stroke="#d9822b" stroke-width="3" d="M90,150 C190,160 260,250 360,282 S500,300 520,302"/>
  <!-- too easy: low, flat -->
  <polyline fill="none" stroke="#3a9a5b" stroke-width="2.5" points="90,315 520,315"/>

  <!-- legend / labels -->
  <g font-size="13.5">
    <text x="590" y="84" font-weight="600" fill="#666">Too hard</text>
    <text x="590" y="102" font-size="12" fill="#666">error stays high: noise</text>

    <text x="590" y="196" font-weight="700" fill="#d9822b">Just right</text>
    <text x="590" y="214" font-size="12" fill="#8a5a22">error is falling:</text>
    <text x="590" y="230" font-size="12" fill="#8a5a22">learning progress is high</text>
    <text x="590" y="246" font-size="12" fill="#8a5a22">→ curiosity goes here</text>

    <text x="590" y="310" font-weight="600" fill="#3a9a5b">Too easy</text>
    <text x="590" y="328" font-size="12" fill="#3a9a5b">error already low: mastered</text>
  </g>

  <text x="24" y="388" font-size="12" fill="#777">Schematic. Learning progress = how fast error is falling. It reads the learner's own error curve over time.</text>
</svg>
