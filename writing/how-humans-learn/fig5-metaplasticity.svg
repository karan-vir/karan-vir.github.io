<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
  <title>Metaplasticity: history sets how much a connection can change</title>
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="340" rx="14" fill="#f7f7f4"/>

  <g font-size="13" font-weight="600" fill="#555" text-anchor="middle">
    <text x="130" y="36">Same new input</text>
    <text x="350" y="36">Connection's history</text>
    <text x="560" y="36">How much it changes</text>
  </g>

  <!-- row A -->
  <rect x="60" y="70" width="140" height="56" rx="10" fill="#fdf1e4" stroke="#d9822b" stroke-width="2"/>
  <text x="130" y="103" text-anchor="middle" font-size="14" fill="#1d1d1b">new experience</text>
  <line x1="204" y1="98" x2="256" y2="98" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="260" y="70" width="180" height="56" rx="10" fill="#fff" stroke="#7a5cc2" stroke-width="2"/>
  <text x="350" y="94" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d1d1b">A: long, important use</text>
  <text x="350" y="113" text-anchor="middle" font-size="12" fill="#555">plasticity turned down</text>
  <line x1="444" y1="98" x2="476" y2="98" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="480" y="86" width="40" height="24" rx="4" fill="#7a5cc2"/>
  <text x="532" y="103" font-size="12.5" fill="#5d4597">small change → old skill protected</text>

  <!-- row B -->
  <rect x="60" y="180" width="140" height="56" rx="10" fill="#fdf1e4" stroke="#d9822b" stroke-width="2"/>
  <text x="130" y="213" text-anchor="middle" font-size="14" fill="#1d1d1b">new experience</text>
  <line x1="204" y1="208" x2="256" y2="208" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="260" y="180" width="180" height="56" rx="10" fill="#fff" stroke="#3a9a5b" stroke-width="2"/>
  <text x="350" y="204" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1d1d1b">B: little history</text>
  <text x="350" y="223" text-anchor="middle" font-size="12" fill="#555">plasticity stays high</text>
  <line x1="444" y1="208" x2="476" y2="208" stroke="#555" stroke-width="2" marker-end="url(#a5)"/>
  <rect x="480" y="196" width="190" height="24" rx="4" fill="#3a9a5b"/>
  <text x="480" y="244" font-size="12.5" fill="#2d7a48">large change → new skill learned</text>

  <text x="24" y="292" font-size="13" fill="#1d1d1b">The learning rate is not one global number. Each connection's past sets its own.</text>
  <text x="24" y="320" font-size="12" fill="#777">Schematic. Illustrates the idea; real mechanisms vary and are not this tidy.</text>
</svg>
